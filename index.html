<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BadBank Application</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #fff0f6;
    }

    .navbar,
    .btn-primary {
      background: blue;
    }

    .navbar {
      padding: 15px 25px;
    }

    .card {
      border: 1px solid violet;
      border-radius: 15px;
    }

    #balanceDisplay {
      color: blue;
      font-weight: bold;
    }

    .nav-pills {
      background: #fce7f3;
      border-radius: 10px;
    }

    .nav-pills .nav-link {
      color: #be185d;
    }

    .nav-pills .nav-link.active {
      background: blue;
      color: white;
    }

    .btn-primary {
      border: none;
    }

    .btn-primary:hover {
      background: #db2777;
    }

    .form-control:focus {
      border-color: #ec4899;
      box-shadow: 0 0 5px #f9a8d4;
    }

    .form-label {
      color: #9d174d;
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-dark mb-4">
    <span class="navbar-brand">BadBank Portal</span>
  </nav>


  <!-- Main Container -->
  <div class="container">

    <div class="row justify-content-center">

      <div class="col-md-6">

        <!-- Balance Card -->
        <div class="card p-4 text-center mb-4">

          <h5>Account Balance</h5>

          <h2 id="balanceDisplay">$100.00</h2>

        </div>


        <!-- Transaction Card -->
        <div class="card p-4">

          <!-- Deposit / Withdraw Tabs -->
          <ul class="nav nav-pills nav-fill mb-3">

            <li class="nav-item">

              <button
                class="nav-link active w-100"
                id="depositTab"
                onclick="switchAction('deposit')"
              >
                Deposit
              </button>

            </li>

            <li class="nav-item">

              <button
                class="nav-link w-100"
                id="withdrawTab"
                onclick="switchAction('withdraw')"
              >
                Withdraw
              </button>

            </li>

          </ul>


          <!-- Amount Label -->
          <label
            class="form-label"
            id="actionLabel"
          >
            Deposit Amount
          </label>


          <!-- Amount Input -->
          <input
            type="number"
            class="form-control mb-3"
            id="amountInput"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
          >


          <!-- Transaction Button -->
          <button
            class="btn btn-primary w-100"
            id="actionBtn"
            onclick="handleTransaction()"
          >
            Deposit Money
          </button>


          <!-- Alert Message -->
          <div
            id="alertBox"
            class="mt-3"
          ></div>

        </div>

      </div>

    </div>

  </div>


  <!-- JavaScript -->
  <script>

    // Initial balance
    let balance = 100;

    // Default transaction mode
    let mode = "deposit";


    // -----------------------------------------
    // Switch between Deposit and Withdraw
    // -----------------------------------------
    function switchAction(type) {

      // Update mode
      mode = type;

      // Clear input
      document.getElementById("amountInput").value = "";

      // Clear previous alert
      document.getElementById("alertBox").innerHTML = "";


      // Change active tab
      document
        .getElementById("depositTab")
        .classList
        .toggle("active", type === "deposit");

      document
        .getElementById("withdrawTab")
        .classList
        .toggle("active", type === "withdraw");


      // Change label
      document.getElementById("actionLabel").innerText =
        type === "deposit"
          ? "Deposit Amount"
          : "Withdraw Amount";


      // Change button text
      document.getElementById("actionBtn").innerText =
        type === "deposit"
          ? "Deposit Money"
          : "Withdraw Money";
    }


    // -----------------------------------------
    // Handle Deposit / Withdraw
    // -----------------------------------------
    function handleTransaction() {

      // Get input element
      const input = document.getElementById("amountInput");

      // Convert input to number
      const val = Number(input.value);

      // Get alert box
      const alertBox = document.getElementById("alertBox");


      // -----------------------------------------
      // Validate amount
      // -----------------------------------------
      if (
        input.value.trim() === "" ||
        !Number.isFinite(val) ||
        val <= 0
      ) {

        alertBox.innerHTML =
          '<div class="alert alert-danger">' +
          'Enter a valid positive amount.' +
          '</div>';

        return;
      }


      // -----------------------------------------
      // Check insufficient balance
      // -----------------------------------------
      if (mode === "withdraw" && val > balance) {

        alertBox.innerHTML =
          '<div class="alert alert-warning">' +
          'Insufficient balance!' +
          '</div>';

        return;
      }


      // -----------------------------------------
      // Update balance
      // -----------------------------------------
      balance += mode === "deposit"
        ? val
        : -val;


      // -----------------------------------------
      // Display updated balance
      // -----------------------------------------
      document.getElementById("balanceDisplay").innerText =
        "$" + balance.toFixed(2);


      // -----------------------------------------
      // Success message
      // -----------------------------------------
      alertBox.innerHTML =
        `<div class="alert alert-success">
          Successfully ${
            mode === "deposit"
              ? "deposited"
              : "withdrew"
          } $${val.toFixed(2)}!
        </div>`;


      // Clear input
      input.value = "";
    }

  </script>

</body>

</html>
